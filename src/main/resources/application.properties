spring.application.name=AutoLocation
server.port=8089
server.servlet.context-path=/gestionprojets
spring.datasource.url=jdbc:mysql://localhost:3306/autolocation_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=


# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Documentation API (springdoc / Swagger UI) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
